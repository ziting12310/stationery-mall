<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="购物车占位图">
  <!-- 奶白纸张底 + 手绘虚线圈 -->
  <rect x="4" y="4" width="112" height="112" rx="4" fill="#fffef5" stroke="#2c2c2c" stroke-width="1.4" stroke-dasharray="6 5"/>
  <!-- 轻微倾斜的文具涂鸦 -->
  <g transform="rotate(-2 60 60)">
    <!-- 笔记本 -->
    <rect x="26" y="72" width="52" height="30" rx="3" fill="#ffd93d" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="5 4"/>
    <line x1="42" y1="72" x2="42" y2="102" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
    <!-- 铅笔 -->
    <g transform="rotate(20 76 52)">
      <rect x="72" y="42" width="10" height="34" rx="2" fill="#4ecdc4" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="5 4"/>
      <path d="M72 42 L77 30 L82 42 Z" fill="#ff6b6b" stroke="#2c2c2c" stroke-width="1.8" stroke-dasharray="4 4"/>
    </g>
  </g>
  <!-- 手绘小星星 -->
  <path d="M30 30 l4 9 l10 2 l-7 6 l2 10 l-9 -5 l-9 5 l2 -10 l-7 -6 l10 -2 z" fill="#ff6b6b" opacity="0.85" stroke="#2c2c2c" stroke-width="1.1" stroke-dasharray="3 3"/>
</svg>

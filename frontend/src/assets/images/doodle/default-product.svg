<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="商品占位图">
  <!-- 奶白纸张底 + 手绘虚线圈 -->
  <rect x="8" y="8" width="384" height="284" rx="6" fill="#fffef5" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="7 6"/>
  <!-- 纸张横线 -->
  <g stroke="#4ecdc4" stroke-width="1" stroke-dasharray="10 8" opacity="0.5">
    <line x1="40" y1="96" x2="360" y2="96"/>
    <line x1="40" y1="132" x2="360" y2="132"/>
    <line x1="40" y1="204" x2="360" y2="204"/>
    <line x1="40" y1="240" x2="360" y2="240"/>
  </g>
  <!-- 轻微倾斜的文具涂鸦 -->
  <g transform="rotate(-2 200 150)">
    <!-- 笔记本 -->
    <rect x="126" y="104" width="132" height="88" rx="4" fill="#ffd93d" stroke="#2c2c2c" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="168" y1="104" x2="168" y2="192" stroke="#2c2c2c" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7"/>
    <!-- 铅笔 -->
    <g transform="rotate(18 268 168)">
      <rect x="252" y="150" width="18" height="70" rx="2" fill="#4ecdc4" stroke="#2c2c2c" stroke-width="2" stroke-dasharray="6 5"/>
      <path d="M252 150 L261 132 L270 150 Z" fill="#ff6b6b" stroke="#2c2c2c" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="252" y="208" width="18" height="12" rx="2" fill="#fffef5" stroke="#2c2c2c" stroke-width="2" stroke-dasharray="5 4"/>
    </g>
    <!-- 橡皮擦 -->
    <rect x="196" y="150" width="40" height="26" rx="3" fill="#ff6b6b" stroke="#2c2c2c" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <!-- 手绘星星与小波浪 -->
  <path d="M78 66 l6 14 l15 2 l-11 10 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -10 l15 -2 z" fill="#ff6b6b" opacity="0.85" stroke="#2c2c2c" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M300 66 q12 -10 24 0 q12 10 24 0" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-dasharray="6 5"/>
</svg>

# ==========================================================
# 文具商城 MVP · 后端配置
# 技术栈：Java 17 + Spring Boot 3 + MyBatis + MySQL 8
# 说明：Mapper XML 位于 resources/mybatis/mapper/
# ==========================================================

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: stationery-mall-backend

  # ---------- 数据源（MySQL 8 / InnoDB / utf8mb4） ----------
  datasource:
    url: jdbc:mysql://localhost:3306/mall_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 130026
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: MallHikariPool

  # ---------- 上传限制（NFR：单图 <= 5MB） ----------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # ---------- JSON 序列化 ----------
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always

# ---------- MyBatis ----------
mybatis:
  # 实体包（XML 中可用 Goods、Order 等别名）
  type-aliases-package: com.stationerymall.entity
  # 枚举 TypeHandler 包：自动注册 UserRole / GoodsStatus / OrderStatus 的 TINYINT 映射
  type-handlers-package: com.stationerymall.handler
  configuration:
    # 下划线转驼峰：snake_case 自动映射 camelCase
    map-underscore-to-camel-case: true
    # 可空字段（如 categories.parent_id、orders.remark）写入 NULL 时使用 NULL 类型，避免 MySQL 驱动报错
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 30
  mapper-locations: classpath:mybatis/mapper/*.xml

# ---------- 业务自定义配置 ----------
mall:
  # 登录态请求头约定：Authorization: Bearer <jwt>
  token:
    header: Authorization
    prefix: "Bearer "
  # JWT 配置：HS256 签名密钥（必须 >= 32 字节）与过期时间
  jwt:
    secret: stationery-mall-hs256-secret-key-2026-ai-plb-1
    expire-minutes: 720
  # CORS：前端 Vite 开发地址，多个用英文逗号分隔
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
    max-age: 3600

logging:
  level:
    root: INFO
    com.stationerymall: DEBUG
